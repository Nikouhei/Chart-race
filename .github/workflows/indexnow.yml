name: IndexNow Auto Submit

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "**.html"
      - "astro.config.*"
      - "build/postbuild.mjs"
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # sitemap.xml は公開サイトから取らず、ビルド結果（dist/sitemap.xml）を使う。
      # GitHub Actions の IP からのアクセスは Cloudflare のボット対策で 403 になるため。
      - name: Build site
        run: |
          npm ci
          npm run build

      # Cloudflare 側のデプロイ完了を待ってから通知する（検索エンジンがすぐ取りに来ても新しいページが返るように）
      - name: Wait for deployment
        run: sleep 60

      - name: Submit to IndexNow
        run: node analytics/submit-indexnow.mjs
