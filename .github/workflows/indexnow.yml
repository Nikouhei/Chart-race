name: IndexNow Auto Submit

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "**.html"
      - "astro.config.*"
      - "build/postbuild.mjs"
  workflow_dispatch:

# ビルドして外部（IndexNow）へ通知するだけなので、リポジトリは読み取りのみ
permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # sitemap.xml は公開サイトから取らず、ビルド結果（dist/sitemap.xml）を使う。
      # GitHub Actions の IP からのアクセスは Cloudflare のボット対策で 403 になるため。
      - name: Build site
        run: |
          npm ci
          npm run build

      # Cloudflare 側のデプロイ完了を待ってから通知する（検索エンジンがすぐ取りに来ても新しいページが返るように）
      - name: Wait for deployment
        run: sleep 60

      - name: Submit to IndexNow
        run: node analytics/submit-indexnow.mjs
